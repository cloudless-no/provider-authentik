apiVersion: stages.authentik.m.crossplane.io/v1alpha1
kind: Identification
metadata:
  annotations:
    meta.upbound.io/example-id: stages/v1alpha1/identification
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: test-ident
    passwordStageSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    sources:
    - ${authentik_source_oauth.name.uuid}
    userFields:
    - username

---

apiVersion: oauth.authentik.m.crossplane.io/v1alpha1
kind: Source
metadata:
  annotations:
    meta.upbound.io/example-id: stages/v1alpha1/identification
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    authenticationFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    consumerKey: foo
    consumerSecretSecretRef:
      key: example-key
      name: example-secret
    enrollmentFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    name: test
    providerType: discord
    slug: test

---

apiVersion: stages.authentik.m.crossplane.io/v1alpha1
kind: Password
metadata:
  annotations:
    meta.upbound.io/example-id: stages/v1alpha1/identification
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    backends:
    - authentik.core.auth.InbuiltBackend
    name: test-pass
