apiVersion: rbac.authentik.m.crossplane.io/v1alpha1
kind: PermissionRole
metadata:
  annotations:
    meta.upbound.io/example-id: rbac/v1alpha1/permissionrole
  labels:
    testing.upbound.io/example-name: global-permission
  name: global-permission
  namespace: crossplane-system
spec:
  forProvider:
    permission: authentik_flows.inspect_flow
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: my-role

---

apiVersion: flows.authentik.m.crossplane.io/v1alpha1
kind: Flow
metadata:
  annotations:
    meta.upbound.io/example-id: rbac/v1alpha1/permissionrole
  labels:
    testing.upbound.io/example-name: flow
  name: flow
  namespace: crossplane-system
spec:
  forProvider:
    designation: authorization
    name: test-flow
    slug: test-flow
    title: Test flow
