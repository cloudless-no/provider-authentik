apiVersion: radius.authentik.m.crossplane.io/v1alpha1
kind: Provider
metadata:
  annotations:
    meta.upbound.io/example-id: radius/v1alpha1/provider
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    authorizationFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    clientNetworks: 10.10.0.0/24
    name: radius-app
    sharedSecretSecretRef:
      key: example-key
      name: example-secret

---

apiVersion: applications.authentik.m.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: radius/v1alpha1/provider
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: radius-app
    protocolProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    slug: radius-app
