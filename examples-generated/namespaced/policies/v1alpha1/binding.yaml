apiVersion: policies.authentik.m.crossplane.io/v1alpha1
kind: Binding
metadata:
  annotations:
    meta.upbound.io/example-id: policies/v1alpha1/binding
  labels:
    testing.upbound.io/example-name: app-access
  name: app-access
  namespace: crossplane-system
spec:
  forProvider:
    order: 0
    policy: ${authentik_policy_expression.policy.id}
    targetSelector:
      matchLabels:
        testing.upbound.io/example-name: name

---

apiVersion: applications.authentik.m.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: policies/v1alpha1/binding
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: test app
    slug: test-app

---

apiVersion: policies.authentik.m.crossplane.io/v1alpha1
kind: Expression
metadata:
  annotations:
    meta.upbound.io/example-id: policies/v1alpha1/binding
  labels:
    testing.upbound.io/example-name: policy
  name: policy
  namespace: crossplane-system
spec:
  forProvider:
    expression: return True
    name: example
