apiVersion: applications.authentik.m.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: applications/v1alpha1/application
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: example-app
    protocolProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    slug: example-app

---

apiVersion: policies.authentik.m.crossplane.io/v1alpha1
kind: Binding
metadata:
  annotations:
    meta.upbound.io/example-id: applications/v1alpha1/application
  labels:
    testing.upbound.io/example-name: app-access
  name: app-access
  namespace: crossplane-system
spec:
  forProvider:
    order: 0
    policy: ${authentik_policy_expression.policy.id}
    targetSelector:
      matchLabels:
        testing.upbound.io/example-name: name

---

apiVersion: policies.authentik.m.crossplane.io/v1alpha1
kind: Expression
metadata:
  annotations:
    meta.upbound.io/example-id: applications/v1alpha1/application
  labels:
    testing.upbound.io/example-name: policy
  name: policy
  namespace: crossplane-system
spec:
  forProvider:
    expression: return True
    name: example

---

apiVersion: oauth2.authentik.m.crossplane.io/v1alpha1
kind: Provider
metadata:
  annotations:
    meta.upbound.io/example-id: applications/v1alpha1/application
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    authorizationFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    clientId: example-app
    clientSecretSecretRef:
      key: example-key
      name: example-secret
    name: example-app
