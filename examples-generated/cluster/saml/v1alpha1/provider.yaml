apiVersion: saml.authentik.crossplane.io/v1alpha1
kind: Provider
metadata:
  annotations:
    meta.upbound.io/example-id: saml/v1alpha1/provider
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    acsUrl: http://localhost
    authorizationFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    name: test-app

---

apiVersion: applications.authentik.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: saml/v1alpha1/provider
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    name: test-app
    protocolProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    slug: test-app
